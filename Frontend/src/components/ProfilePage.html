<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="ProfilePage.css">
</head>
<body>
    <div class="page-container">
        <div class="profile-card">
            <div class="profile-header">
                <img src="path-to-your-logo.png" alt="Logo" class="header-logo">
                <h2>My Profile</h2>
            </div>

            <div class="profile-body">
                <div class="avatar-container">
                    <img src="path-to-user-image.jpg" alt="Profile Photo" class="profile-avatar">
                    <button class="btn btn-secondary-outline btn-change-photo">
                        <i class="fas fa-camera"></i> Change Photo
                    </button>
                </div>

                <h3 class="profile-name">superadmin</h3>
                <ul class="profile-details">
                    <li><strong>Full Name:</strong> <span>superadmin</span></li>
                    <li><strong>Username:</strong> <span>superadmin</span></li>
                    <li><strong>Email:</strong> <span>superadmin@port.com</span></li>
                    <li><strong>Institution:</strong> <span>Port Administration</span></li>
                </ul>

                <div class="profile-actions">
                    <button class="btn btn-primary">Edit Profile</button>
                    <button class="btn btn-secondary-outline">Change Password</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
